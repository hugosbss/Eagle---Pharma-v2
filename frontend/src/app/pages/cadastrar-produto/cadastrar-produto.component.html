<div class="page-container">
  <div class="page-header">
    <h2>Cadastro de Produtos</h2>
  </div>

  <section class="cadastro">
    <form (ngSubmit)="criarProduto()" class="form-cadastro estilizado">
      <div class="linha">
        <div class="form-group">
          <label>Nome</label>
          <input [(ngModel)]="novoProduto.nome" name="nome" required />
        </div>
        <div class="form-group">
          <label>Preço (R$)</label>
          <input type="number" step="0.01" [(ngModel)]="novoProduto.preco" name="preco" required />
        </div>
      </div>

      <div class="linha">
        <div class="form-group">
          <label>Quantidade</label>
          <input type="number" [(ngModel)]="novoProduto.quantidade_estoque" name="quantidade_estoque" />
        </div>
        <div class="form-group">
            <label>Categoria</label>
            <input [(ngModel)]="novoProduto.categoria" name="categoria" />
        </div>
      </div>

      <div class="form-group">
        <label>Descrição</label>
        <textarea [(ngModel)]="novoProduto.descricao" name="descricao"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn salvar">Salvar</button>
        <button type="reset" class="btn cancelar">Limpar</button>
      </div>
      <p class="erro" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </section>

  <section class="latest">
    <div class="latest-header">
      <h3>Últimos cadastrados</h3>
      <a class="ver-todos" routerLink="/produtos">Ver todos</a>
    </div>

    <div class="cards-grid" *ngIf="ultimosProdutos?.length; else vazio">
      <article class="card" *ngFor="let p of ultimosProdutos | slice:0:5">
        <div class="card-top">
          <h4 class="card-title">{{ p.nome }}</h4>
          <span class="price">{{ p.preco | currency:'BRL' }}</span>
        </div>
        <p class="desc">{{ p.descricao || 'Sem descrição' }}</p>
        <span class="categoria">{{ p.categoria || '-' }}</span>
      </article>
    </div>

    <ng-template #vazio>
      <div class="empty">
        <p>Nenhum produto recente. Cadastre o primeiro acima.</p>
      </div>
    </ng-template>
  </section>
</div>
